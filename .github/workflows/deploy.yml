name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# Required for the deploy job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
        with:
          # Turns Pages on if it is not already, instead of failing with a 404
          # from the Pages API on a fresh repository.
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run check

      - name: Build
        # The custom domain in public/CNAME is the canonical home, so the site
        # URL is fixed here rather than read from `configure-pages`. Reading it
        # would produce joellots.github.io/<repo> on any run made before the
        # domain is attached, baking a wrong base path into every asset URL.
        env:
          SITE_URL: https://joelokore.tech
          BASE_PATH: ''
        run: npm run build

      - name: Verify build output
        env:
          BASE_PATH: ''
        run: node scripts/verify-output.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
